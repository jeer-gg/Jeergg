<!DOCTYPE html>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      background: #050505;
      color: white;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;
    }

    body {
      min-height: 100vh;
    }

    .page {
      width: 100%;
      max-width: 650px;
      margin: 0 auto;
      min-height: 100vh;
      background: #050505;
      overflow: hidden;
    }

    .hero {
      position: relative;
      width: 100%;
      height: 68vh;
      min-height: 540px;
      max-height: 800px;
      overflow: hidden;
    }

    .hero img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
      object-position: center top;
    }

    .hero::after {
      content: "";
      position: absolute;
      inset: 0;
      background:

          rgba(0,0,0,0) 40%,
          rgba(0,0,0,0.05) 52%,
          rgba(0,0,0,0.20) 63%,

    .profile {

      right: 20px;
      bottom: 28px;
      text-align: center;

    .name {

    .username {

    .age-modal {

      inset: 0;

  <script>

    const translations = {

        age: "Este conteúdo é destinado apenas a adultos (18+)",
        cancel: "Cancelar",
        continue: "Tenho 18+, Continuar",
        opened: "Abrindo seu navegador",
        description: "Um momento…",
        holdTitle: "Mais um passo",

      },

      de: {
        subtitle: "Was du suchst, ist hier",
        main: "Was du suchst, ist hier 🤍",
        age: "Dieser Inhalt ist nur für Erwachsene bestimmt (18+)",
        cancel: "Abbrechen",
        continue: "Ich bin 18+, Weiter",
        opened: "Browser wird geöffnet",
        description: "Einen Moment…",
        holdTitle: "Noch ein Schritt",
        holdDescription: "Deine App öffnet Links nicht automatisch.",
        holdButton: "Weiter",
        holdHint: "Halte den Button oben 3 Sekunden gedrückt und wähle \"Im Browser öffnen\""
      },

      it: {
        subtitle: "Quello che cerchi è qui",
        main: "Quello che cerchi è qui 🤍",
        age: "Questo contenuto è destinato esclusivamente agli adulti (18+)",
        cancel: "Annulla",
        continue: "Ho più di 18 anni, Continua",
        opened: "Apertura del browser",
        description: "Un momento…",
        holdTitle: "Ancora un passo",
        holdDescription: "La tua app non apre i link automaticamente.",
        holdButton: "Continua",
        holdHint: "Tieni premuto il pulsante sopra per 3 secondi e scegli \"Apri nel browser\""
      }

    };


    const detectedLanguage =
      (
        navigator.languages &&
        navigator.languages.length
          ? navigator.languages[0]
          : navigator.language
      ) || "en";

    const language =
      detectedLanguage
        .toLowerCase()
        .split("-")[0];

    const text =
      translations[language] ||
      translations.en;


    document.getElementById("subtitle").textContent =
      text.subtitle;

    document.getElementById("mainButton").textContent =
      text.main;

    document.getElementById("ageText").textContent =
      text.age;

    document.getElementById("cancelButton").textContent =
      text.cancel;

    document.getElementById("continueButton").textContent =
      text.continue;




    const ageModal =
      document.getElementById("ageModal");

    const mainButton =
      document.getElementById("mainButton");

    const cancelButton =
      document.getElementById("cancelButton");

    const continueButton =
      document.getElementById("continueButton");

    const escapeScreen =
      document.getElementById("escapeScreen");

    const escapeTitle =
      document.getElementById("escapeTitle");

    const escapeDescription =
      document.getElementById("escapeDescription");

    const escapeLink =
      document.getElementById("escapeLink");

    const escapeHint =
      document.getElementById("escapeHint");


    escapeTitle.textContent =
      text.opened;

    escapeDescription.textContent =
      text.description;

    escapeLink.textContent =
      text.holdButton;

    escapeHint.textContent =
      text.holdHint;


    const userAgent =
      navigator.userAgent ||
      navigator.vendor ||
      "";

    const debugUA = document.getElementById("debugUA");
    if (debugUA) {
      debugUA.textContent = "UA: " + userAgent;
    }

    const isInstagram =
      /Instagram/i.test(userAgent);

    const isFacebook =
      /FBAN|FBAV|FB_IAB|FBIOS|MessengerForiOS/i.test(userAgent);

    const isTikTok =
      /TikTok|musical_ly|Bytedance/i.test(userAgent);

    /*
      Otros navegadores internos
      conocidos sin esquema de escape
      documentado (mismo tratamiento
      que Facebook/TikTok: se intenta
      target=_blank y, si falla, se
      pide el gesto manual).
    */

    const isOtherKnownInApp =
      /Snapchat|Reddit|Twitter|LinkedInApp|Pinterest|Telegram|WhatsApp|Discord|Slack|\bLine\//i.test(userAgent);

    /*
      iPadOS reporta "Macintosh" en el
      userAgent desde hace varias
      versiones (Safari de escritorio
      simulado), así que un iPad real
      no se detectaría como iOS con
      solo /iPhone|iPad|iPod/. La
      comprobación de puntos táctiles
      lo distingue de una Mac real.
    */

    const isIOS =
      /iPhone|iPad|iPod/i.test(userAgent) ||
      (
        navigator.platform === "MacIntel" &&
        navigator.maxTouchPoints > 1
      );

    const isAndroid =
      /Android/i.test(userAgent);

    /*
      DETECCIÓN GENÉRICA — la red de
      seguridad para cualquier app que
      no reconocemos por nombre (o que
      cambió su forma de identificarse,
      como puede estar pasando con
      Facebook ahora mismo).

      En iOS: todo navegador legítimo
      (Safari, Chrome, Firefox, Edge)
      incluye el token "Safari/x.x" en
      su user agent, por requisito de
      Apple sobre WebKit. Los navegadores
      internos de apps (WKWebView
      personalizados) casi nunca lo
      incluyen. Si es iOS y NO aparece
      "Safari", es casi con certeza un
      navegador embebido de alguna app,
      aunque no sepamos cuál.

      En Android: los WebView del
      sistema (los que usan las apps
      para su navegador interno) llevan
      la marca "; wv)" en el user agent
      desde Android Lollipop.
    */

    const isUnknownIOSInAppBrowser =
      isIOS && !/Safari/i.test(userAgent);

    const isUnknownAndroidInAppBrowser =
      isAndroid && /;\s*wv\)/i.test(userAgent);

    const isInAppBrowser =
      isInstagram ||
      isFacebook ||
      isTikTok ||
      isOtherKnownInApp ||
      isUnknownIOSInAppBrowser ||
      isUnknownAndroidInAppBrowser;


    mainButton.addEventListener(
      "click",
      function () {
        ageModal.classList.add("show");
      }
    );


    cancelButton.addEventListener(
      "click",
      function () {
        ageModal.classList.remove("show");
      }
    );


    ageModal.addEventListener(
      "click",
      function (event) {

        if (event.target === ageModal) {
          ageModal.classList.remove("show");
        }

      }
    );


    /*
      PANTALLA DE ESPERA
      (mientras se dispara el esquema
      y se verifica si funcionó)
    */

    function showWaitingScreen() {

      ageModal.classList.remove("show");

      escapeTitle.textContent = text.opened;
      escapeDescription.textContent = text.description;
      escapeLink.style.display = "none";
      escapeHint.style.display = "none";

      escapeScreen.classList.add("show");

    }


    /*
      PANTALLA DE "MANTÉN PRESIONADO"
      Se usa solo cuando no existe
      ningún esquema para salir del
      navegador interno (Facebook en
      iOS). El enlace es un <a href>
      real: el gesto de mantener
      presionado sobre un enlace real
      es lo único que activa el menú
      nativo de iOS con la opción
      "Abrir en Safari". Esto no lo
      puede disparar JavaScript, solo
      guiar al usuario a hacerlo.
    */

    function showHoldScreen(url) {

      ageModal.classList.remove("show");

      escapeTitle.textContent = text.holdTitle;
      escapeDescription.textContent = text.holdDescription;

      escapeLink.href = url;
      escapeLink.style.display = "inline-flex";

      escapeHint.style.display = "block";

      escapeScreen.classList.add("show");

    }


    /*
      VERIFICACIÓN DEL ESCAPE
      (mismo patrón que usan las
      páginas de este tipo: disparar
      el esquema y OBSERVAR si de
      verdad funcionó, en lugar de
      asumirlo).

      Si en ~2.2s la página nunca se
      oculta (visibilitychange /
      pagehide), Instagram/Facebook
      ignoraron el esquema: en ese
      caso dejamos de fingir y
      navegamos directo al enlace
      dentro del mismo navegador,
      porque no hay otra opción real.
    */

    /*
      VERIFICACIÓN DEL ESCAPE — v2

      El problema del intento anterior:
      un solo setTimeout de 2.2s no
      distingue entre "el escape falló"
      y "el escape funcionó pero el
      teléfono tardó en confirmarlo".

      Cuando iOS cambia de app, puede
      SUSPENDER el JavaScript de esta
      página mientras dura el cambio.
      Si eso pasa, nuestro timer se
      dispara tarde (una vez que vuelve
      el JS), no a los 2.2s exactos.
      Un timer que se disparó tarde ya
      es, por definición, una señal de
      que SÍ hubo cambio de app — no
      hay que tratarlo como fallo.

      Además, un "blur" (la pestaña
      pierde el foco) sin que vuelva el
      "focus" significa que el cambio de
      app sigue en curso en ese momento:
      hay que esperar a que se resuelva
      en vez de dar un veredicto ahí
      mismo, con un tope de 10s.

      Solo si, tras todo eso, la página
      sigue visible y el tiempo corrió
      normal, asumimos que el esquema
      fue ignorado y navegamos al
      enlace dentro del mismo navegador
      (única alternativa real que queda).
    */

    function observeEscape(url, onFail) {

      let settled = false;

      const firedAt = Date.now();

      let blurredAt = 0;
      let refocusedAt = 0;


      function cleanup() {

        document.removeEventListener("visibilitychange", onVisibilityChange);
        window.removeEventListener("pagehide", onPageHide);
        window.removeEventListener("pageshow", onPageShow);
        window.removeEventListener("blur", onBlur);
        window.removeEventListener("focus", onFocus);

      }


      function finish(landed) {

        if (settled) {
          return;
        }

        settled = true;

        cleanup();

        if (!landed) {

          onFail(url);

        }

      }


      function onVisibilityChange() {

        if (document.hidden) {
          finish(true);
        }

      }

      function onPageHide() {
        finish(true);
      }

      function onPageShow(event) {

        if (event && event.persisted) {
          finish(true);
        }

      }

      function onBlur() {

        if (!blurredAt) {
          blurredAt = Date.now();
        }

      }

      function onFocus() {

        if (blurredAt) {
          refocusedAt = Date.now();
        }

      }


      document.addEventListener("visibilitychange", onVisibilityChange);
      window.addEventListener("pagehide", onPageHide);
      window.addEventListener("pageshow", onPageShow);
      window.addEventListener("blur", onBlur);
      window.addEventListener("focus", onFocus);


      /*
        Comprobaciones tempranas, por si
        el cambio de estado ya ocurrió
        antes del veredicto final.
      */

      [150, 450, 800].forEach(function (delay) {

        setTimeout(onVisibilityChange, delay);

      });


      function checkVerdict(expectedElapsed) {

        if (settled) {
          return;
        }

        if (document.hidden) {
          finish(true);
          return;
        }

        const elapsed = Date.now() - firedAt;

        /*
          El timer se disparó mucho más
          tarde de lo previsto: el JS
          estuvo suspendido por el cambio
          de app. Eso es éxito, no fallo.
        */

        if (elapsed > expectedElapsed + 1300) {
          finish(true);
          return;
        }

        /*
          Cambio de app en curso (hubo
          blur, no ha vuelto el focus):
          esperar en vez de decidir ya,
          con un tope de 10s.
        */

        if (blurredAt && !refocusedAt && elapsed < 10000) {

          setTimeout(
            function () {
              checkVerdict(Math.max(expectedElapsed + 500, Date.now() - firedAt));
            },
            500
          );

          return;

        }

        finish(false);

      }

      setTimeout(
        function () {
          checkVerdict(2200);
        },
        2200
      );

    }


    function openExternalBrowser(url) {

      /*
        iOS + Instagram: único caso con
        un esquema real de escape.
      */

      if (isInstagram && isIOS) {

        showWaitingScreen();

        window.location.replace(
          "instagram://extbrowser/?url=" +
          encodeURIComponent(url)
        );

        observeEscape(url, showHoldScreen);

        return;
      }


      /*
        Android + cualquier navegador
        interno reconocido: el intent
        del sistema operativo suele
        respetarse de forma confiable,
        sin importar qué app lo aloje.
      */

      if (isInAppBrowser && isAndroid) {

        showWaitingScreen();

        try {

          const parsed = new URL(url);

          const intentURL =
            "intent://" +
            parsed.host +
            parsed.pathname +
            parsed.search +
            parsed.hash +
            "#Intent;" +
            "scheme=https;" +
            "action=android.intent.action.VIEW;" +
            "category=android.intent.category.BROWSABLE;" +
            "end";

          window.location.href = intentURL;

          observeEscape(url, showHoldScreen);

        } catch (error) {

          showHoldScreen(url);

        }

        return;
      }


      /*
        iOS + cualquier otro navegador
        interno (Facebook, TikTok,
        Snapchat, Twitter/X, LinkedIn,
        Pinterest, Telegram, WhatsApp,
        Discord, Reddit, Line...): no
        existe un esquema documentado
        como el de Instagram, pero SÍ
        podemos probar algo distinto:
        simular el clic en un enlace
        real con target="_blank".
        Algunos navegadores internos
        delegan esa petición de "pestaña
        nueva" al sistema (Safari) en
        vez de abrir otra pestaña
        interna. No hay garantía de que
        cada app lo haga —no es un
        esquema documentado— pero si
        falla, cae al mismo respaldo
        manual de siempre, sin ningún
        costo adicional.
      */

      if (isInAppBrowser && isIOS) {

        showWaitingScreen();

        const probe = document.createElement("a");
        probe.href = url;
        probe.target = "_blank";
        probe.rel = "noopener noreferrer";
        probe.style.display = "none";

        document.body.appendChild(probe);
        probe.click();
        probe.remove();

        observeEscape(url, showHoldScreen);

        return;
      }


      /*
        Cualquier otro caso sin esquema
        conocido: se le pide al usuario
        el gesto nativo directamente.
      */

      if (isInAppBrowser) {

        showHoldScreen(url);

        return;
      }


      /*
        Navegador normal, fuera de
        Instagram/Facebook: navegación
        directa, sin trucos.
      */

      window.location.href = url;

    }


    continueButton.addEventListener(
      "click",
      function () {

        openExternalBrowser(destination);

      }
    );

  </script>

</body>
</html>
