<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <title>Jeergg</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      background: #050505;
      color: white;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;
    }

    body {
      min-height: 100vh;
    }

    .page {
      width: 100%;
      max-width: 650px;
      margin: 0 auto;
      min-height: 100vh;
      background: #050505;
      overflow: hidden;
    }

    /* FOTO */

    .hero {
      position: relative;
      width: 100%;
      height: 68vh;
      min-height: 540px;
      max-height: 800px;
      overflow: hidden;
    }

    .hero img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
      object-position: center top;
    }

    .hero::after {
      content: "";
      position: absolute;
      inset: 0;

      background:
        linear-gradient(
          to bottom,
          rgba(0,0,0,0) 40%,
          rgba(0,0,0,0.05) 52%,
          rgba(0,0,0,0.20) 63%,
          rgba(5,5,5,0.60) 80%,
          #050505 100%
        );

      pointer-events: none;
    }

    /* PERFIL */

    .profile {
      position: absolute;
      z-index: 2;
      left: 20px;
      right: 20px;
      bottom: 28px;
      text-align: center;
    }

    .name {
      margin: 0 0 7px;
      font-size: 37px;
      line-height: 1;
      font-weight: 700;
    }

    .username {
      margin: 0 0 15px;
      font-size: 19px;
      color: rgba(255,255,255,0.65);
    }

    .subtitle {
      margin: 0;
      font-size: 19px;
      line-height: 1.4;
      color: rgba(255,255,255,0.72);
    }

    /* BOTÓN */

    .actions {
      padding: 0 20px 45px;
    }

    .main-button {
      width: 100%;
      min-height: 78px;

      border: 2px solid rgba(255,255,255,0.82);
      border-radius: 18px;

      background: #191919;
      color: white;

      padding: 17px 20px;

      font-size: 21px;

      cursor: pointer;

      -webkit-tap-highlight-color: transparent;
    }

    .main-button:active {
      transform: scale(0.985);
      background: #242424;
    }

    /* MODAL 18+ */

    .age-modal {
      display: none;

      position: fixed;
      inset: 0;

      z-index: 9999;

      background: rgba(0,0,0,0.42);

      align-items: center;
      justify-content: center;

      padding: 20px;

      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
    }

    .age-modal.show {
      display: flex;
    }

    .age-box {
      width: 100%;
      max-width: 470px;

      background: rgba(12,12,12,0.98);

      border: 1px solid rgba(255,255,255,0.16);

      border-radius: 22px;

      padding: 24px 20px 20px;

      text-align: center;

      box-shadow: 0 18px 60px rgba(0,0,0,0.60);
    }

    .age-text {
      margin: 0 0 22px;

      font-size: 18px;
      line-height: 1.4;
    }

    .age-actions {
      display: flex;
      gap: 11px;
    }

    .age-btn {
      border-radius: 11px;

      padding: 13px 15px;

      font-size: 16px;

      border: 1px solid rgba(255,255,255,0.20);

      cursor: pointer;

      -webkit-tap-highlight-color: transparent;
    }

    .age-btn.cancel {
      background: #2d2d2d;
      color: white;
    }

    .age-btn.continue {
      background: white;
      color: black;
      flex: 1;
    }

    /* PANTALLA AL VOLVER */

    .return-screen {
      display: none;

      position: fixed;
      inset: 0;

      z-index: 20000;

      background: #000;

      align-items: center;
      justify-content: center;

      text-align: center;

      padding: 25px;
    }

    .return-screen.show {
      display: flex;
    }

    .return-box {
      width: 100%;
      max-width: 420px;
    }

    .return-title {
      margin: 0 0 10px;
      font-size: 24px;
    }

    .return-description {
      margin: 0 0 25px;
      color: rgba(255,255,255,0.6);
      line-height: 1.5;
    }

    .return-button {
      width: 100%;
      min-height: 64px;

      border-radius: 16px;

      border: 1px solid rgba(255,255,255,0.65);

      background: #191919;
      color: white;

      font-size: 18px;

      cursor: pointer;
    }

    @media (max-width: 430px) {

      .hero {
        height: 66vh;
        min-height: 500px;
      }

      .name {
        font-size: 34px;
      }

      .username {
        font-size: 18px;
      }

      .subtitle {
        font-size: 17px;
      }

      .main-button {
        min-height: 72px;
        font-size: 19px;
      }

      .age-text {
        font-size: 17px;
      }
    }

    @media (max-width: 350px) {

      .age-actions {
        flex-direction: column;
      }

      .age-btn {
        width: 100%;
      }
    }
  </style>
</head>

<body>

  <main class="page">

    <section class="hero">

      <img
        src="IMG_6983.jpeg"
        alt="Jeergg"
      >

      <div class="profile">

        <h1 class="name">
          Jeergg
        </h1>

        <p class="username">
          @jeergg
        </p>

        <p
          id="subtitle"
          class="subtitle"
        >
          What you're looking for is here
        </p>

      </div>

    </section>


    <section class="actions">

      <button
        id="mainButton"
        class="main-button"
        type="button"
      >
        What you're looking for is here 🤍
      </button>

    </section>

  </main>


  <!-- 18+ -->

  <div
    id="ageModal"
    class="age-modal"
  >

    <div class="age-box">

      <p
        id="ageText"
        class="age-text"
      >
        This content is intended for adults only (18+)
      </p>

      <div class="age-actions">

        <button
          id="cancelButton"
          class="age-btn cancel"
          type="button"
        >
          Cancel
        </button>

        <button
          id="continueButton"
          class="age-btn continue"
          type="button"
        >
          I am 18+, Continue
        </button>

      </div>

    </div>

  </div>


  <!-- PANTALLA DE REGRESO -->

  <div
    id="returnScreen"
    class="return-screen"
  >

    <div class="return-box">

      <h2
        id="returnTitle"
        class="return-title"
      >
        Opened in your browser
      </h2>

      <p
        id="returnDescription"
        class="return-description"
      >
        Return to my Instagram profile.
      </p>

      <button
        id="returnButton"
        class="return-button"
        type="button"
      >
        Open @jeer.gg
      </button>

    </div>

  </div>


  <script>

    /* =====================================
       DESTINO EXTERNO
       ===================================== */

    const destination =
      "https://rebrand.ly/w3p1cn7";


    /* =====================================
       PERFIL DE INSTAGRAM
       ===================================== */

    const instagramUsername =
      "jeer.gg";

    const instagramProfileDeepLink =
      "instagram://user?username=" +
      instagramUsername;


    /* =====================================
       TRADUCCIONES
       ===================================== */

    const translations = {

      es: {
        subtitle: "Lo que buscas aquí",
        main: "Lo que buscas aquí 🤍",
        age:
          "Este contenido está destinado únicamente a adultos (18+)",
        cancel:
          "Cancelar",
        continue:
          "Soy mayor de 18, continuar",
        opened:
          "Abierto en tu navegador",
        description:
          "Al regresar, puedes volver directamente a mi perfil de Instagram.",
        profile:
          "Abrir @jeer.gg"
      },

      en: {
        subtitle:
          "What you're looking for is here",
        main:
          "What you're looking for is here 🤍",
        age:
          "This content is intended for adults only (18+)",
        cancel:
          "Cancel",
        continue:
          "I am 18+, Continue",
        opened:
          "Opened in your browser",
        description:
          "When you return, you can go directly to my Instagram profile.",
        profile:
          "Open @jeer.gg"
      },

      pt: {
        subtitle:
          "O que você procura está aqui",
        main:
          "O que você procura está aqui 🤍",
        age:
          "Este conteúdo é destinado apenas a adultos (18+)",
        cancel:
          "Cancelar",
        continue:
          "Tenho 18+, Continuar",
        opened:
          "Aberto no seu navegador",
        description:
          "Ao voltar, você pode ir diretamente ao meu perfil do Instagram.",
        profile:
          "Abrir @jeer.gg"
      },

      fr: {
        subtitle:
          "Ce que vous cherchez est ici",
        main:
          "Ce que vous cherchez est ici 🤍",
        age:
          "Ce contenu est réservé aux adultes (18+)",
        cancel:
          "Annuler",
        continue:
          "J'ai 18 ans ou plus, Continuer",
        opened:
          "Ouvert dans votre navigateur",
        description:
          "À votre retour, accédez directement à mon profil Instagram.",
        profile:
          "Ouvrir @jeer.gg"
      },

      de: {
        subtitle:
          "Was du suchst, ist hier",
        main:
          "Was du suchst, ist hier 🤍",
        age:
          "Dieser Inhalt ist nur für Erwachsene bestimmt (18+)",
        cancel:
          "Abbrechen",
        continue:
          "Ich bin 18+, Weiter",
        opened:
          "Im Browser geöffnet",
        description:
          "Nach deiner Rückkehr kannst du direkt zu meinem Instagram-Profil gehen.",
        profile:
          "@jeer.gg öffnen"
      },

      it: {
        subtitle:
          "Quello che cerchi è qui",
        main:
          "Quello che cerchi è qui 🤍",
        age:
          "Questo contenuto è destinato esclusivamente agli adulti (18+)",
        cancel:
          "Annulla",
        continue:
          "Ho più di 18 anni, Continua",
        opened:
          "Aperto nel browser",
        description:
          "Quando torni, puoi andare direttamente al mio profilo Instagram.",
        profile:
          "Apri @jeer.gg"
      }

    };


    const detectedLanguage =
      (
        navigator.languages &&
        navigator.languages.length
          ? navigator.languages[0]
          : navigator.language
      ) || "en";

    const language =
      detectedLanguage
        .toLowerCase()
        .split("-")[0];

    const text =
      translations[language] ||
      translations.en;


    document.getElementById("subtitle").textContent =
      text.subtitle;

    document.getElementById("mainButton").textContent =
      text.main;

    document.getElementById("ageText").textContent =
      text.age;

    document.getElementById("cancelButton").textContent =
      text.cancel;

    document.getElementById("continueButton").textContent =
      text.continue;

    document.getElementById("returnTitle").textContent =
      text.opened;

    document.getElementById("returnDescription").textContent =
      text.description;

    document.getElementById("returnButton").textContent =
      text.profile;


    /* =====================================
       ELEMENTOS
       ===================================== */

    const ageModal =
      document.getElementById("ageModal");

    const mainButton =
      document.getElementById("mainButton");

    const cancelButton =
      document.getElementById("cancelButton");

    const continueButton =
      document.getElementById("continueButton");

    const returnScreen =
      document.getElementById("returnScreen");

    const returnButton =
      document.getElementById("returnButton");


    /* =====================================
       DETECCIÓN
       ===================================== */

    const userAgent =
      navigator.userAgent ||
      navigator.vendor ||
      "";

    const isInstagram =
      /Instagram/i.test(userAgent);

    const isFacebook =
      /FBAN|FBAV|FB_IAB/i.test(userAgent);

    const isIOS =
      /iPhone|iPad|iPod/i.test(userAgent);

    const isAndroid =
      /Android/i.test(userAgent);

    const isInAppBrowser =
      isInstagram || isFacebook;


    /* =====================================
       ESTADO
       ===================================== */

    let externalLinkStarted = false;
    let externalLinkTime = 0;
    let pageBecameHidden = false;


    /* =====================================
       MODAL
       ===================================== */

    mainButton.addEventListener(
      "click",
      function () {

        ageModal.classList.add("show");

      }
    );


    cancelButton.addEventListener(
      "click",
      function () {

        ageModal.classList.remove("show");

      }
    );


    ageModal.addEventListener(
      "click",
      function (event) {

        if (event.target === ageModal) {

          ageModal.classList.remove("show");

        }

      }
    );


    /* =====================================
       ABRIR PERFIL INSTAGRAM
       ===================================== */

    function openInstagramProfile() {

      window.location.href =
        instagramProfileDeepLink;

    }


    returnButton.addEventListener(
      "click",
      function () {

        openInstagramProfile();

      }
    );


    /* =====================================
       ABRIR NAVEGADOR EXTERNO
       ===================================== */

    function openExternalBrowser(url) {

      externalLinkStarted = true;

      externalLinkTime =
        Date.now();

      ageModal.classList.remove("show");

      returnScreen.classList.add("show");


      /* =============================
         INSTAGRAM + IPHONE
         ============================= */

      if (isInstagram && isIOS) {

        const externalURL =
          "instagram://extbrowser/?url=" +
          encodeURIComponent(url);

        window.location.href =
          externalURL;

        return;
      }


      /* =============================
         INSTAGRAM + ANDROID
         ============================= */

      if (isInstagram && isAndroid) {

        try {

          const parsed =
            new URL(url);

          const intentURL =
            "intent://" +
            parsed.host +
            parsed.pathname +
            parsed.search +
            parsed.hash +
            "#Intent;" +
            "scheme=https;" +
            "action=android.intent.action.VIEW;" +
            "category=android.intent.category.BROWSABLE;" +
            "end";

          window.location.href =
            intentURL;

        } catch (error) {

          returnScreen.classList.remove("show");

        }

        return;
      }


      /* =============================
         FACEBOOK + IPHONE
         ============================= */

      if (isFacebook && isIOS) {

        window.location.href =
          url;

        return;
      }


      /* =============================
         OTROS NAVEGADORES
         ============================= */

      if (!isInAppBrowser) {

        window.location.href =
          url;

      }

    }


    /* =====================================
       CONTINUAR
       ===================================== */

    continueButton.addEventListener(
      "click",
      function () {

        openExternalBrowser(
          destination
        );

      }
    );


    /* =====================================
       DETECTAR QUE SALIÓ DE INSTAGRAM
       ===================================== */

    document.addEventListener(
      "visibilitychange",
      function () {

        if (!externalLinkStarted) {
          return;
        }


        if (document.hidden) {

          pageBecameHidden = true;

          return;

        }


        /*
          Si la página estuvo oculta significa
          que el usuario salió al navegador
          externo y luego regresó.
        */

        if (
          !document.hidden &&
          pageBecameHidden &&
          isInstagram
        ) {

          const elapsed =
            Date.now() -
            externalLinkTime;


          /*
            Evita activar el perfil demasiado
            rápido durante el propio salto.
          */

          if (elapsed > 1200) {

            setTimeout(
              function () {

                openInstagramProfile();

              },
              250
            );

          }

        }

      }
    );


    /* =====================================
       RESPALDO AL VOLVER POR CACHE
       ===================================== */

    window.addEventListener(
      "pageshow",
      function () {

        if (
          externalLinkStarted &&
          pageBecameHidden &&
          isInstagram
        ) {

          const elapsed =
            Date.now() -
            externalLinkTime;

          if (elapsed > 1500) {

            setTimeout(
              function () {

                openInstagramProfile();

              },
              300
            );

          }

        }

      }
    );

  </script>

</body>
</html>
