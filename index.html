<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <title>Jeergg</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      background: #050505;
      color: white;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;
    }

    body {
      min-height: 100vh;
    }

    .page {
      width: 100%;
      max-width: 650px;
      margin: 0 auto;
      min-height: 100vh;
      background: #050505;
      overflow: hidden;
    }

    .hero {
      position: relative;
      width: 100%;
      height: 68vh;
      min-height: 540px;
      max-height: 800px;
      overflow: hidden;
    }

    .hero img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
      object-position: center top;
    }

    .hero::after {
      content: "";
      position: absolute;
      inset: 0;

      background:
        linear-gradient(
          to bottom,
          rgba(0,0,0,0) 40%,
          rgba(0,0,0,0.05) 52%,
          rgba(0,0,0,0.20) 63%,
          rgba(5,5,5,0.60) 80%,
          #050505 100%
        );

      pointer-events: none;
    }

    .profile {
      position: absolute;
      z-index: 2;
      left: 20px;
      right: 20px;
      bottom: 28px;
      text-align: center;
    }

    .name {
      margin: 0 0 7px;
      font-size: 37px;
      line-height: 1;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    .username {
      margin: 0 0 15px;
      font-size: 19px;
      color: rgba(255,255,255,0.65);
    }

    .subtitle {
      margin: 0;
      font-size: 19px;
      line-height: 1.4;
      color: rgba(255,255,255,0.72);
    }

    .actions {
      padding: 0 20px 45px;
    }

    .main-button {
      width: 100%;
      min-height: 78px;
      border: 2px solid rgba(255,255,255,0.82);
      border-radius: 18px;
      background: #191919;
      color: white;
      padding: 17px 20px;
      font-size: 21px;
      font-weight: 400;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .main-button:active {
      transform: scale(0.985);
      background: #242424;
    }

    .age-modal {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: rgba(0,0,0,0.38);
      align-items: center;
      justify-content: center;
      padding: 20px;
      backdrop-filter: blur(3px);
      -webkit-backdrop-filter: blur(3px);
    }

    .age-modal.show {
      display: flex;
    }

    .age-box {
      width: 100%;
      max-width: 470px;
      background: rgba(12,12,12,0.97);
      border: 1px solid rgba(255,255,255,0.16);
      border-radius: 22px;
      padding: 23px 20px 20px;
      text-align: center;
      box-shadow: 0 18px 60px rgba(0,0,0,0.58);
    }

    .age-text {
      margin: 0 0 22px;
      font-size: 18px;
      line-height: 1.4;
      color: white;
    }

    .age-actions {
      display: flex;
      justify-content: center;
      align-items: stretch;
      gap: 11px;
    }

    .age-btn {
      border-radius: 11px;
      padding: 12px 15px;
      font-size: 16px;
      border: 1px solid rgba(255,255,255,0.20);
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .age-btn.cancel {
      background: #2d2d2d;
      color: white;
    }

    .age-btn.continue {
      background: white;
      color: black;
      flex: 1;
    }

    .return-screen {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 10000;
      background: #000;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }

    .return-screen.show {
      display: flex;
    }

    .return-box {
      width: 100%;
      max-width: 420px;
    }

    .return-title {
      font-size: 22px;
      margin: 0 0 24px;
    }

    .return-button {
      width: 100%;
      min-height: 62px;
      border: 1px solid rgba(255,255,255,0.65);
      border-radius: 16px;
      background: #171717;
      color: #fff;
      font-size: 18px;
      cursor: pointer;
    }

    @media (max-width: 430px) {
      .hero {
        height: 66vh;
        min-height: 500px;
      }

      .name {
        font-size: 34px;
      }

      .username {
        font-size: 18px;
      }

      .subtitle {
        font-size: 17px;
      }

      .main-button {
        min-height: 72px;
        font-size: 19px;
      }

      .age-text {
        font-size: 17px;
      }

      .age-btn {
        font-size: 15px;
      }
    }

    @media (max-width: 350px) {
      .age-actions {
        flex-direction: column;
      }

      .age-btn {
        width: 100%;
      }
    }
  </style>
</head>

<body>

  <main class="page">

    <section class="hero">

      <img
        src="IMG_6983.jpeg"
        alt="Jeergg"
      >

      <div class="profile">

        <h1 class="name">
          Jeergg
        </h1>

        <p class="username">
          @jeergg
        </p>

        <p
          id="subtitle"
          class="subtitle"
        >
          What you're looking for is here
        </p>

      </div>

    </section>

    <section class="actions">

      <button
        id="mainButton"
        class="main-button"
        type="button"
      >
        What you're looking for is here 🤍
      </button>

    </section>

  </main>

  <div
    id="ageModal"
    class="age-modal"
  >

    <div class="age-box">

      <p
        id="ageText"
        class="age-text"
      >
        This content is intended for adults only (18+)
      </p>

      <div class="age-actions">

        <button
          id="cancelButton"
          class="age-btn cancel"
          type="button"
        >
          Cancel
        </button>

        <button
          id="continueButton"
          class="age-btn continue"
          type="button"
        >
          I am 18+, Continue
        </button>

      </div>

    </div>

  </div>

  <div
    id="returnScreen"
    class="return-screen"
  >

    <div class="return-box">

      <p
        id="returnTitle"
        class="return-title"
      >
        Opened in your browser
      </p>

      <button
        id="returnButton"
        class="return-button"
        type="button"
      >
        Back to Instagram
      </button>

    </div>

  </div>

  <script>

    const destination =
      "https://rebrand.ly/w3p1cn7";


    const translations = {

      es: {
        subtitle: "Lo que buscas aquí",
        main: "Lo que buscas aquí 🤍",
        age: "Este contenido está destinado únicamente a adultos (18+)",
        cancel: "Cancelar",
        continue: "Soy mayor de 18, continuar",
        opened: "Abierto en tu navegador",
        back: "Volver a Instagram"
      },

      en: {
        subtitle: "What you're looking for is here",
        main: "What you're looking for is here 🤍",
        age: "This content is intended for adults only (18+)",
        cancel: "Cancel",
        continue: "I am 18+, Continue",
        opened: "Opened in your browser",
        back: "Back to Instagram"
      },

      pt: {
        subtitle: "O que você procura está aqui",
        main: "O que você procura está aqui 🤍",
        age: "Este conteúdo é destinado apenas a adultos (18+)",
        cancel: "Cancelar",
        continue: "Tenho 18+, Continuar",
        opened: "Aberto no seu navegador",
        back: "Voltar ao Instagram"
      },

      fr: {
        subtitle: "Ce que vous cherchez est ici",
        main: "Ce que vous cherchez est ici 🤍",
        age: "Ce contenu est réservé aux adultes (18+)",
        cancel: "Annuler",
        continue: "J'ai 18 ans ou plus, Continuer",
        opened: "Ouvert dans votre navigateur",
        back: "Retour à Instagram"
      },

      de: {
        subtitle: "Was du suchst, ist hier",
        main: "Was du suchst, ist hier 🤍",
        age: "Dieser Inhalt ist nur für Erwachsene bestimmt (18+)",
        cancel: "Abbrechen",
        continue: "Ich bin 18+, Weiter",
        opened: "Im Browser geöffnet",
        back: "Zurück zu Instagram"
      },

      it: {
        subtitle: "Quello che cerchi è qui",
        main: "Quello che cerchi è qui 🤍",
        age: "Questo contenuto è destinato esclusivamente agli adulti (18+)",
        cancel: "Annulla",
        continue: "Ho più di 18 anni, Continua",
        opened: "Aperto nel browser",
        back: "Torna a Instagram"
      }

    };


    const detectedLanguage =
      (
        navigator.languages &&
        navigator.languages.length
          ? navigator.languages[0]
          : navigator.language
      ) || "en";

    const language =
      detectedLanguage
        .toLowerCase()
        .split("-")[0];

    const text =
      translations[language] ||
      translations.en;


    document.getElementById("subtitle").textContent =
      text.subtitle;

    document.getElementById("mainButton").textContent =
      text.main;

    document.getElementById("ageText").textContent =
      text.age;

    document.getElementById("cancelButton").textContent =
      text.cancel;

    document.getElementById("continueButton").textContent =
      text.continue;

    document.getElementById("returnTitle").textContent =
      text.opened;

    document.getElementById("returnButton").textContent =
      text.back;


    const ageModal =
      document.getElementById("ageModal");

    const mainButton =
      document.getElementById("mainButton");

    const cancelButton =
      document.getElementById("cancelButton");

    const continueButton =
      document.getElementById("continueButton");

    const returnScreen =
      document.getElementById("returnScreen");

    const returnButton =
      document.getElementById("returnButton");


    mainButton.addEventListener(
      "click",
      function () {
        ageModal.classList.add("show");
      }
    );


    cancelButton.addEventListener(
      "click",
      function () {
        ageModal.classList.remove("show");
      }
    );


    ageModal.addEventListener(
      "click",
      function (event) {
        if (event.target === ageModal) {
          ageModal.classList.remove("show");
        }
      }
    );


    function showReturnScreen() {
      ageModal.classList.remove("show");
      returnScreen.classList.add("show");
    }


    function openExternalBrowser(url) {

      const ua =
        navigator.userAgent ||
        navigator.vendor ||
        "";

      const isInstagram =
        /Instagram/i.test(ua);

      const isFacebook =
        /FBAN|FBAV|FB_IAB/i.test(ua);

      const isIOS =
        /iPhone|iPad|iPod/i.test(ua);

      const isAndroid =
        /Android/i.test(ua);

      const isInAppBrowser =
        isInstagram || isFacebook;


      if (isInAppBrowser && isIOS) {

        showReturnScreen();

        const externalURL =
          "instagram://extbrowser/?url=" +
          encodeURIComponent(url);

        window.location.href =
          externalURL;

        return;
      }


      if (isInAppBrowser && isAndroid) {

        showReturnScreen();

        try {

          const parsed =
            new URL(url);

          const intentURL =
            "intent://" +
            parsed.host +
            parsed.pathname +
            parsed.search +
            parsed.hash +
            "#Intent;" +
            "scheme=https;" +
            "action=android.intent.action.VIEW;" +
            "category=android.intent.category.BROWSABLE;" +
            "end";

          window.location.href =
            intentURL;

        } catch (error) {
          returnScreen.classList.remove("show");
        }

        return;
      }


      window.location.href =
        url;
    }


    continueButton.addEventListener(
      "click",
      function () {
        openExternalBrowser(destination);
      }
    );


    returnButton.addEventListener(
      "click",
      function () {

        window.location.href =
          "instagram://";

      }
    );

  </script>

</body>
</html>
