<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <title>Jeergg</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      background: #050505;
      color: white;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;
    }

    body {
      min-height: 100vh;
    }

    .page {
      width: 100%;
      max-width: 650px;
      margin: 0 auto;
      min-height: 100vh;
      background: #050505;
      overflow: hidden;
    }

    .hero {
      position: relative;
      width: 100%;
      height: 68vh;
      min-height: 540px;
      max-height: 800px;
      overflow: hidden;
    }

    .hero img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
      object-position: center top;
    }

    .hero::after {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(
          to bottom,
          rgba(0,0,0,0) 40%,
          rgba(0,0,0,0.05) 52%,
          rgba(0,0,0,0.20) 63%,
          rgba(5,5,5,0.60) 80%,
          #050505 100%
        );
      pointer-events: none;
    }

    .profile {
      position: absolute;
      z-index: 2;
      left: 20px;
      right: 20px;
      bottom: 28px;
      text-align: center;
    }

    .name {
      margin: 0 0 7px;
      font-size: 37px;
      line-height: 1;
      font-weight: 700;
    }

    .username {
      margin: 0 0 15px;
      font-size: 19px;
      color: rgba(255,255,255,0.65);
    }

    .subtitle {
      margin: 0;
      font-size: 19px;
      line-height: 1.4;
      color: rgba(255,255,255,0.72);
    }

    .actions {
      padding: 0 20px 45px;
    }

    .main-button {
      width: 100%;
      min-height: 78px;
      border: 2px solid rgba(255,255,255,0.82);
      border-radius: 18px;
      background: #191919;
      color: white;
      padding: 17px 20px;
      font-size: 21px;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .main-button:active {
      transform: scale(0.985);
      background: #242424;
    }

    .age-modal {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: rgba(0,0,0,0.42);
      align-items: center;
      justify-content: center;
      padding: 20px;
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
    }

    .age-modal.show {
      display: flex;
    }

    .age-box {
      width: 100%;
      max-width: 470px;
      background: rgba(12,12,12,0.98);
      border: 1px solid rgba(255,255,255,0.16);
      border-radius: 22px;
      padding: 24px 20px 20px;
      text-align: center;
      box-shadow: 0 18px 60px rgba(0,0,0,0.60);
    }

    .age-text {
      margin: 0 0 22px;
      font-size: 18px;
      line-height: 1.4;
    }

    .age-actions {
      display: flex;
      gap: 11px;
    }

    .age-btn {
      border-radius: 11px;
      padding: 13px 15px;
      font-size: 16px;
      border: 1px solid rgba(255,255,255,0.20);
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .age-btn.cancel {
      background: #2d2d2d;
      color: white;
    }

    .age-btn.continue {
      background: white;
      color: black;
      flex: 1;
    }

    .return-screen {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 20000;
      background: #000;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 25px;
    }

    .return-screen.show {
      display: flex;
    }

    .return-box {
      width: 100%;
      max-width: 420px;
    }

    .return-title {
      margin: 0 0 10px;
      font-size: 24px;
    }

    .return-description {
      margin: 0 0 25px;
      color: rgba(255,255,255,0.6);
      line-height: 1.5;
    }

    .return-button {
      width: 100%;
      min-height: 64px;
      border-radius: 16px;
      border: 1px solid rgba(255,255,255,0.65);
      background: #191919;
      color: white;
      font-size: 18px;
      cursor: pointer;
    }

    @media (max-width: 430px) {
      .hero {
        height: 66vh;
        min-height: 500px;
      }

      .name {
        font-size: 34px;
      }

      .username {
        font-size: 18px;
      }

      .subtitle {
        font-size: 17px;
      }

      .main-button {
        min-height: 72px;
        font-size: 19px;
      }

      .age-text {
        font-size: 17px;
      }
    }

    @media (max-width: 350px) {
      .age-actions {
        flex-direction: column;
      }

      .age-btn {
        width: 100%;
      }
    }
  </style>
</head>

<body>

  <main class="page">

    <section class="hero">

      <img
        src="IMG_6983.jpeg"
        alt="Jeergg"
      >

      <div class="profile">

        <h1 class="name">
          Jeergg
        </h1>

        <p class="username">
          @jeergg
        </p>

        <p
          id="subtitle"
          class="subtitle"
        >
          What you're looking for is here
        </p>

      </div>

    </section>

    <section class="actions">

      <button
        id="mainButton"
        class="main-button"
        type="button"
      >
        What you're looking for is here 🤍
      </button>

    </section>

  </main>


  <div
    id="ageModal"
    class="age-modal"
  >

    <div class="age-box">

      <p
        id="ageText"
        class="age-text"
      >
        This content is intended for adults only (18+)
      </p>

      <div class="age-actions">

        <button
          id="cancelButton"
          class="age-btn cancel"
          type="button"
        >
          Cancel
        </button>

        <button
          id="continueButton"
          class="age-btn continue"
          type="button"
        >
          I am 18+, Continue
        </button>

      </div>

    </div>

  </div>


  <div
    id="returnScreen"
    class="return-screen"
  >

    <div class="return-box">

      <h2
        id="returnTitle"
        class="return-title"
      >
        Opened in your browser
      </h2>

      <p
        id="returnDescription"
        class="return-description"
      >
        Return directly to my Instagram profile.
      </p>

      <button
        id="returnButton"
        class="return-button"
        type="button"
      >
        Open @jeer.gg
      </button>

    </div>

  </div>


  <script>

    const destination =
      "https://rebrand.ly/w3p1cn7";

    const instagramUsername =
      "jeer.gg";

    const instagramProfileDeepLink =
      "instagram://user?username=" +
      instagramUsername;


    const translations = {

      es: {
        subtitle: "Lo que buscas aquí",
        main: "Lo que buscas aquí 🤍",
        age: "Este contenido está destinado únicamente a adultos (18+)",
        cancel: "Cancelar",
        continue: "Soy mayor de 18, continuar",
        opened: "Abierto en tu navegador",
        description: "Vuelve directamente a mi perfil de Instagram.",
        profile: "Abrir @jeer.gg"
      },

      en: {
        subtitle: "What you're looking for is here",
        main: "What you're looking for is here 🤍",
        age: "This content is intended for adults only (18+)",
        cancel: "Cancel",
        continue: "I am 18+, Continue",
        opened: "Opened in your browser",
        description: "Return directly to my Instagram profile.",
        profile: "Open @jeer.gg"
      },

      pt: {
        subtitle: "O que você procura está aqui",
        main: "O que você procura está aqui 🤍",
        age: "Este conteúdo é destinado apenas a adultos (18+)",
        cancel: "Cancelar",
        continue: "Tenho 18+, Continuar",
        opened: "Aberto no seu navegador",
        description: "Volte diretamente ao meu perfil do Instagram.",
        profile: "Abrir @jeer.gg"
      },

      fr: {
        subtitle: "Ce que vous cherchez est ici",
        main: "Ce que vous cherchez est ici 🤍",
        age: "Ce contenu est réservé aux adultes (18+)",
        cancel: "Annuler",
        continue: "J'ai 18 ans ou plus, Continuer",
        opened: "Ouvert dans votre navigateur",
        description: "Retournez directement à mon profil Instagram.",
        profile: "Ouvrir @jeer.gg"
      },

      de: {
        subtitle: "Was du suchst, ist hier",
        main: "Was du suchst, ist hier 🤍",
        age: "Dieser Inhalt ist nur für Erwachsene bestimmt (18+)",
        cancel: "Abbrechen",
        continue: "Ich bin 18+, Weiter",
        opened: "Im Browser geöffnet",
        description: "Direkt zu meinem Instagram-Profil zurückkehren.",
        profile: "@jeer.gg öffnen"
      },

      it: {
        subtitle: "Quello che cerchi è qui",
        main: "Quello che cerchi è qui 🤍",
        age: "Questo contenuto è destinato esclusivamente agli adulti (18+)",
        cancel: "Annulla",
        continue: "Ho più di 18 anni, Continua",
        opened: "Aperto nel browser",
        description: "Torna direttamente al mio profilo Instagram.",
        profile: "Apri @jeer.gg"
      }

    };


    const detectedLanguage =
      (
        navigator.languages &&
        navigator.languages.length
          ? navigator.languages[0]
          : navigator.language
      ) || "en";

    const language =
      detectedLanguage
        .toLowerCase()
        .split("-")[0];

    const text =
      translations[language] ||
      translations.en;


    document.getElementById("subtitle").textContent =
      text.subtitle;

    document.getElementById("mainButton").textContent =
      text.main;

    document.getElementById("ageText").textContent =
      text.age;

    document.getElementById("cancelButton").textContent =
      text.cancel;

    document.getElementById("continueButton").textContent =
      text.continue;

    document.getElementById("returnTitle").textContent =
      text.opened;

    document.getElementById("returnDescription").textContent =
      text.description;

    document.getElementById("returnButton").textContent =
      text.profile;


    const ageModal =
      document.getElementById("ageModal");

    const mainButton =
      document.getElementById("mainButton");

    const cancelButton =
      document.getElementById("cancelButton");

    const continueButton =
      document.getElementById("continueButton");

    const returnScreen =
      document.getElementById("returnScreen");

    const returnButton =
      document.getElementById("returnButton");


    const userAgent =
      navigator.userAgent ||
      navigator.vendor ||
      "";

    const isInstagram =
      /Instagram/i.test(userAgent);

    const isFacebook =
      /FBAN|FBAV|FB_IAB|FBIOS/i.test(userAgent);

    const isInAppBrowser =
      isInstagram || isFacebook;

    const isIOS =
      /iPhone|iPad|iPod/i.test(userAgent);

    const isAndroid =
      /Android/i.test(userAgent);


    mainButton.addEventListener(
      "click",
      function () {
        ageModal.classList.add("show");
      }
    );


    cancelButton.addEventListener(
      "click",
      function () {
        ageModal.classList.remove("show");
      }
    );


    ageModal.addEventListener(
      "click",
      function (event) {

        if (event.target === ageModal) {
          ageModal.classList.remove("show");
        }

      }
    );


    function showReturnScreen() {

      ageModal.classList.remove("show");
      returnScreen.classList.add("show");

    }


    /*
      INTENTOS DE CIERRE DE LA
      WEBVIEW DE INSTAGRAM/FACEBOOK.

      Aviso importante: por seguridad,
      ni iOS ni Android permiten que
      JavaScript cierre una pestaña o
      webview que no fue abierta por
      el propio script (window.open).
      window.close() aquí normalmente
      no hará nada visible: es un
      intento "best effort", no una
      garantía. La pantalla de retorno
      se muestra como respaldo por si
      el cierre automático no ocurre.
    */

    function attemptAutoClose() {

      setTimeout(
        function () {

          try {

            window.open("", "_self");

            window.close();

          } catch (e) {}

        },
        300
      );


      setTimeout(
        function () {

          try {

            window.close();

          } catch (e) {}

        },
        900
      );


      setTimeout(
        function () {

          try {

            window.open("", "_self");

            window.close();

          } catch (e) {}

        },
        1600
      );

    }


    function openExternalBrowser(url) {

      showReturnScreen();


      if (isInstagram && isIOS) {

        /*
          Este esquema hace que Instagram
          entregue el enlace a Safari
          (el navegador externo real) y,
          al hacerlo, su propia webview
          interna se retira automáticamente.
        */

        window.location.href =
          "instagram://extbrowser/?url=" +
          encodeURIComponent(url);

        attemptAutoClose();

        return;
      }


      if (isInAppBrowser && isAndroid) {

        try {

          const parsed =
            new URL(url);

          const intentURL =
            "intent://" +
            parsed.host +
            parsed.pathname +
            parsed.search +
            parsed.hash +
            "#Intent;" +
            "scheme=https;" +
            "action=android.intent.action.VIEW;" +
            "category=android.intent.category.BROWSABLE;" +
            "end";

          window.location.href =
            intentURL;

          attemptAutoClose();

        } catch (error) {

          returnScreen.classList.remove("show");

        }

        return;
      }


      /*
        Facebook en iOS no ofrece un
        esquema documentado equivalente
        al de Instagram para forzar la
        salida a Safari, así que solo
        podemos navegar y probar el
        cierre; si no funciona, queda
        la pantalla de retorno manual.
      */

      window.location.href =
        url;

      if (isInAppBrowser) {

        attemptAutoClose();

      }
    }


    continueButton.addEventListener(
      "click",
      function () {

        openExternalBrowser(
          destination
        );

      }
    );


    /*
      ABRIR PERFIL + INTENTAR CERRAR
      LA VENTANA INTERNA DE INSTAGRAM
    */

    returnButton.addEventListener(
      "click",
      function () {

        /*
          Reemplaza la página actual por
          el deep link del perfil.
        */

        try {

          window.location.replace(
            instagramProfileDeepLink
          );

        } catch (e) {

          window.location.href =
            instagramProfileDeepLink;

        }


        attemptAutoClose();

      }
    );

  </script>

</body>
</html>
